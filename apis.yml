name: Teligene
description: >-
  Teligene (Suzhou Teligene Biotechnology Co., Ltd.) is a clinical-stage
  biopharmaceutical company founded in 2011 in Suzhou, China by Dr. Zhang Dawei,
  a former chief scientist at Amgen. The company focuses on the design, research
  and industrialization of innovative small-molecule targeted drugs for oncology,
  with a pipeline addressing lung cancer, breast cancer, and head and neck
  squamous cell carcinoma. Teligene US LLC is a wholly owned US subsidiary
  advancing these candidates through clinical development. It was surfaced as a
  portfolio company of idg-capital and added to the API Evangelist network for
  enrichment; as a drug-development biotech it publishes no public API, developer
  portal, or machine-readable API surface.
